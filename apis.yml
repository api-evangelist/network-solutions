aid: network-solutions
name: Network Solutions
description: >-
  Network Solutions is one of the original ICANN-accredited domain registrars,
  founded in 1979 and operator of the .com, .net and .org registries under the
  InterNIC/NSF cooperative agreement through the 1990s. Today it is a consumer
  and small-business web-services brand of Newfold Digital, selling domain
  registration and transfers, WHOIS lookup, shared and WordPress web hosting,
  SSL/TLS certificates, professional email, a website builder, and online
  marketing services. It operates a domain reseller program (via ResellerClub)
  and an affiliate program, but does not publish a public developer API,
  developer portal, or OpenAPI documentation for third-party integration; the
  reseller and affiliate channels are the only programmatic-adjacent surfaces.
